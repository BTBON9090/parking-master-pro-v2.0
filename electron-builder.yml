appId: cn.btbon.parkingmaster
productName: Parking Master Pro
artifactName: Parking-Master-Pro-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**/*
  - desktop/**/*
  - package.json
asar: true
mac:
  icon: build/icon.icns
  category: public.app-category.simulation-games
  target:
    - dmg
  identity: null
  minimumSystemVersion: '12.0'
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  # Stamp the app icon/version into the PE resources even without a certificate.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
publish: null
